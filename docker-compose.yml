# Start everything with:  docker compose up --build
#
# Every value below can be overridden from the shell or from a .env file next to this
# file (see .env.example). The defaults are what the assignment asks for.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: admission
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: admission
    # Room for two backend processes, each with its own connection pool (default 100 would be tight).
    command: ["postgres", "-c", "max_connections=250"]
    volumes:
      # Named volume: data survives "docker compose down" and a later "docker compose up".
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission -d admission"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING:-Host=postgres;Port=5432;Database=admission;Username=admission;Password=admission}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      # The backend URL as the BROWSER reaches it. Read when the container starts, so changing it
      # needs only a restart, not a rebuild. By default it follows BACKEND_PORT.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Bonus check: a second backend process on another port, sharing the same database.
  # Only started with:  docker compose --profile two-backends up --build
  backend-2:
    profiles: ["two-backends"]
    build: ./backend
    environment:
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING:-Host=postgres;Port=5432;Database=admission;Username=admission;Password=admission}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
    ports:
      - "${BACKEND_2_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
