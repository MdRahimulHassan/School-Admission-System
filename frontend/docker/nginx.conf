server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The page itself and the runtime settings must always be fresh.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Built assets have a content hash in their file name, so they can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
